syntax = "proto3";

package chat.v1;

option go_package = "github.com/FeeRro/messenger_app/gen/chat/v1;chatv1";

import "google/protobuf/timestamp.proto";

// ChatService owns chat metadata and membership (evolution of chat / chat_member tables).
// It is the source of truth for WHO is in a chat — needed by the Fanout service.
service ChatService {
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);
  rpc GetChat(GetChatRequest)       returns (GetChatResponse);
  rpc ListChats(ListChatsRequest)   returns (ListChatsResponse);
  rpc AddMember(AddMemberRequest)   returns (AddMemberResponse);

  // Internal RPC: list of member user_ids. Called by Fanout, not by clients.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
}

// Enum: value 0 must ALWAYS be *_UNSPECIFIED.
// Otherwise "unset" cannot be told apart from the first meaningful value.
enum ChatType {
  CHAT_TYPE_UNSPECIFIED = 0;
  CHAT_TYPE_DIRECT      = 1;
  CHAT_TYPE_GROUP       = 2;
}

// Reusable type — nested field in responses, not an RPC response itself.
message Chat {
  int64    id         = 1;
  ChatType type       = 2;
  google.protobuf.Timestamp created_at = 3;
  repeated int64 member_ids = 4;
}

message CreateChatResponse {
  Chat chat = 1;
}

message GetChatResponse {
  Chat chat = 1;
}

message CreateChatRequest {
  ChatType type       = 1;
  // Members added on creation. The creator is taken from ctx (verified JWT),
  // not from this list — clients must not spoof "on behalf of".
  repeated int64 member_ids = 2;
}

message GetChatRequest {
  int64 chat_id = 1;
}

message ListChatsRequest {
  int64 user_id = 1; // whose chats; Gateway fills this from the token
}

message ListChatsResponse {
  repeated Chat chats = 1;
}

message AddMemberRequest {
  int64 chat_id = 1;
  int64 user_id = 2;
}

message AddMemberResponse {
  bool ok = 1;
}

message ListMembersRequest {
  int64 chat_id = 1;
}

message ListMembersResponse {
  repeated int64 user_ids = 1;
}
