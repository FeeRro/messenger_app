version: v2
# Local plugins: protoc-gen-go / protoc-gen-go-grpc binaries from $GOBIN.
# Installed via `go install` (see Makefile `tools`), no dependency on remote BSR.
plugins:
  # Messages / structs
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  # gRPC server interfaces and clients
  - local: protoc-gen-go-grpc
    out: gen
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
inputs:
  - directory: api/proto
