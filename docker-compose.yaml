services:
  postgres:
    image: postgres:18.3-bookworm
    container_name: postgres-app
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      # Named volume managed by Docker — keeps DB data out of the repo tree
      # so Go tooling doesn't trip over root-owned files. pg18 uses this path.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  migrate:
    image: migrate/migrate:v4.15.2
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  redis:
    image: redis:7.4-alpine
    container_name: redis-app
    # Expose the password to the in-container shell so the healthcheck can read it.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Password via CLI flag; services read REDIS_PASSWORD from .env.
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD}"
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: [CMD-SHELL, "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka-app
    ports:
      # Host-side listener for Go services running on the host (go run).
      - "${KAFKA_PORT}:29092"
    environment:
      # --- KRaft single-node: this broker is also the controller ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Two client listeners: PLAINTEXT for in-compose services (kafka:9092),
      # PLAINTEXT_HOST for host processes (localhost:29092). Classic dual-access setup.
      # Empty host (://:port) binds all interfaces. Do NOT use 0.0.0.0 here:
      # Kafka mirrors listeners into advertised.listeners and rejects 0.0.0.0 there.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      # Single node -> replication factor 1 everywhere.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 10s
      timeout: 10s
      retries: 5
    restart: always

volumes:
  pgdata:
  redisdata:
  kafkadata:
